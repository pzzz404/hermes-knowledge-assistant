[project]
name = "hermes-knowledge-assistant"
version = "0.1.0"
description = "AI knowledge base and support chatbot with source-cited answers"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.133.1", "starlette==1.0.1", "uvicorn==0.41.0", "httpx==0.28.1",
  "pydantic-settings==2.12.0", "beautifulsoup4==4.14.2", "pyyaml==6.0.3"
]
[project.optional-dependencies]
dev = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "playwright==1.56.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
